<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>CineVerse — Profile</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .profile-hero { padding:5.5rem 2.5rem 2.5rem; background:linear-gradient(180deg,rgba(123,47,255,.09) 0%,transparent 100%); border-bottom:1px solid rgba(255,255,255,.05); }
    .profile-top  { display:flex; align-items:flex-end; gap:2rem; max-width:860px; margin:0 auto; }
    .p-avatar-big { width:105px; height:105px; border-radius:50%; font-size:3rem; display:flex; align-items:center; justify-content:center; border:3px solid var(--accent-cyan); box-shadow:var(--shadow-cyan); cursor:pointer; transition:var(--transition); flex-shrink:0; }
    .p-avatar-big:hover { transform:scale(1.06); border-color:var(--accent-purple); }
    .profile-details h1 { font-family:var(--font-display); font-size:1.8rem; font-weight:900; margin-bottom:.25rem; }
    .profile-username { color:var(--accent-cyan); font-family:var(--font-ui); font-size:.95rem; letter-spacing:2px; margin-bottom:.625rem; }
    .p-badge { padding:3px 12px; border-radius:20px; font-family:var(--font-ui); font-size:.72rem; font-weight:700; letter-spacing:1px; }
    .badge-level { background:rgba(123,47,255,.18); border:1px solid var(--accent-purple); color:var(--accent-purple); }
    .badge-prize { background:rgba(255,215,0,.12); border:1px solid var(--accent-gold); color:var(--accent-gold); }

    .xp-section { max-width:860px; margin:1.5rem auto 0; }
    .xp-bar-wrap { background:rgba(255,255,255,.05); border-radius:10px; height:9px; overflow:hidden; margin-top:.375rem; }
    .xp-bar-fill { height:100%; background:var(--grad-accent); border-radius:10px; transition:width 1s cubic-bezier(.4,0,.2,1); box-shadow:0 0 10px rgba(0,229,255,.45); }

    .stats-row { display:grid; grid-template-columns:repeat(5,1fr); gap:.875rem; max-width:860px; margin:1.75rem auto 0; padding:0 2.5rem; }
    .stat-card { text-align:center; padding:1rem; background:var(--bg-card); border:1px solid rgba(255,255,255,.06); border-radius:var(--radius-md); transition:var(--transition); }
    .stat-card:hover { border-color:var(--border-glow); }
    .stat-card-val { font-family:var(--font-display); font-size:1.6rem; font-weight:700; background:var(--grad-accent); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .stat-card-lbl { font-family:var(--font-ui); font-size:.65rem; color:var(--text-dim); letter-spacing:1.5px; margin-top:.2rem; }

    .profile-content { max-width:860px; margin:1.75rem auto; padding:0 2.5rem 5rem; }

    .wl-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:.875rem; }
    .wl-item  { position:relative; border-radius:var(--radius-sm); overflow:hidden; cursor:pointer; transition:var(--transition); }
    .wl-item:hover { transform:translateY(-4px); }
    .wl-item img   { width:100%; aspect-ratio:2/3; object-fit:cover; display:block; }
    .wl-remove     { position:absolute; top:5px; right:5px; width:24px; height:24px; background:rgba(255,45,120,.9); border:none; border-radius:50%; color:#fff; font-size:.8rem; cursor:pointer; display:none; align-items:center; justify-content:center; }
    .wl-item:hover .wl-remove { display:flex; }
    .watched-badge { position:absolute; bottom:0; left:0; right:0; background:rgba(0,229,255,.85); color:var(--bg-primary); font-family:var(--font-ui); font-size:.62rem; font-weight:700; letter-spacing:1px; text-align:center; padding:3px; }

    .ach-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.875rem; }
    .ach-card { display:flex; gap:.875rem; align-items:center; padding:1rem; background:var(--bg-card); border:1px solid; border-radius:var(--radius-md); transition:var(--transition); }
    .ach-card.locked    { opacity:.38; border-color:rgba(255,255,255,.05); }
    .ach-card.unlocked  { border-color:var(--border-glow); }
    .ach-icon { font-size:1.8rem; flex-shrink:0; }

    .upi-section { background:var(--bg-card); border:1px solid rgba(255,215,0,.2); border-radius:var(--radius-lg); padding:1.375rem; margin-bottom:1.75rem; }

    /* Avatar Modal */
    .avatar-grid  { display:grid; grid-template-columns:repeat(6,1fr); gap:.625rem; margin-bottom:1.25rem; }
    .avatar-option { width:52px; height:52px; border-radius:50%; font-size:1.6rem; display:flex; align-items:center; justify-content:center; cursor:pointer; border:2px solid rgba(255,255,255,.08); transition:var(--transition); }
    .avatar-option:hover,.avatar-option.selected { border-color:var(--accent-cyan); transform:scale(1.1); }
    .color-grid  { display:flex; gap:.625rem; justify-content:center; margin-bottom:1.25rem; }
    .color-option { width:34px; height:34px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:var(--transition); }
    .color-option:hover,.color-option.selected { border-color:#fff; transform:scale(1.15); }

    @media(max-width:768px) { .profile-top{flex-direction:column;align-items:center;text-align:center} .stats-row{grid-template-columns:repeat(3,1fr);padding:0 1rem} .profile-content{padding:0 1rem 4rem} }
  </style>
</head>
<body>
<!-- Avatar Modal -->
<div class="modal-overlay" id="avatarModal">
  <div class="modal-card" style="width:460px">
    <h2 style="font-family:var(--font-display);font-size:.88rem;letter-spacing:3px;color:var(--accent-cyan);margin-bottom:1.25rem;text-align:center">🎭 CHOOSE YOUR AVATAR</h2>
    <p style="font-family:var(--font-ui);font-size:.72rem;color:var(--text-dim);letter-spacing:2px;margin-bottom:.625rem">SELECT EMOJI</p>
    <div class="avatar-grid" id="avatarGrid"></div>
    <p style="font-family:var(--font-ui);font-size:.72rem;color:var(--text-dim);letter-spacing:2px;margin-bottom:.625rem">SELECT COLOUR</p>
    <div class="color-grid" id="colorGrid"></div>
    <div style="display:flex;gap:.875rem;justify-content:center">
      <button class="btn btn-primary" onclick="saveAvatar()">SAVE</button>
      <button class="btn btn-ghost"   onclick="closeAvatarModal()">CANCEL</button>
    </div>
    <button onclick="closeAvatarModal()" style="position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:1.25rem">✕</button>
  </div>
</div>

<nav class="navbar">
  <a href="index.html" class="nav-logo">CINEVERSE</a>
  <ul class="nav-links">
    <li><a href="index.html">HOME</a></li>
    <li><a href="leaderboard.html">LEADERBOARD</a></li>
    <li><a href="forum.html">FORUM</a></li>
    <li><a href="profile.html" class="active">PROFILE</a></li>
  </ul>
  <div class="nav-right">
    <button class="btn btn-ghost btn-sm" onclick="CV.logout()">LOGOUT</button>
    <div class="nav-avatar" id="navAvatar" onclick="openAvatarModal()" title="Change avatar">🎬</div>
  </div>
</nav>

<div class="main-content" id="profileMain">
  <div class="loading-container" style="padding-top:35vh"><div class="spinner"></div></div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
if (!CV.isLoggedIn()) window.location.href='index.html';

let currentUser=null, pendingEmoji=null, pendingColor=null;

const LEVELS=[
  {level:1,name:'Rookie Viewer',       minXP:0,   maxXP:100},
  {level:2,name:'Film Buff',           minXP:100, maxXP:250},
  {level:3,name:'Cine Enthusiast',     minXP:250, maxXP:500},
  {level:4,name:'Movie Critic',        minXP:500, maxXP:1000},
  {level:5,name:'Cinema Maestro',      minXP:1000,maxXP:2000},
  {level:6,name:'Legendary Cinephile', minXP:2000,maxXP:Infinity},
];
function getLevelInfo(xp){for(const l of LEVELS)if(xp>=l.minXP&&xp<l.maxXP)return l;return LEVELS[LEVELS.length-1];}
function getXPProgress(xp){const l=getLevelInfo(xp);if(l.maxXP===Infinity)return 100;return Math.round(((xp-l.minXP)/(l.maxXP-l.minXP))*100);}

document.addEventListener('DOMContentLoaded', async()=>{
  currentUser = await initNav();
  if(!currentUser){window.location.href='index.html';return;}
  renderProfile();
  setupAvatarModal();
});

function renderProfile(){
  const u=currentUser;
  const li=getLevelInfo(u.xp||0), xpPct=getXPProgress(u.xp||0);
  const joinDate=new Date(u.createdAt||u.joined||Date.now()).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const rewards=(u.rewards||[]).filter(r=>r.prize>0);

  document.getElementById('profileMain').innerHTML=`
    <div class="profile-hero">
      <div class="profile-top">
        <div class="p-avatar-big" id="pAvatarBig" style="background:${CV.AVATAR_COLORS[u.avatarColor||0]}" onclick="openAvatarModal()" title="Click to change">${u.avatarEmoji||'🎬'}</div>
        <div class="profile-details">
          <h1>${u.name}</h1>
          <div class="profile-username">@${u.username}</div>
          <div style="display:flex;gap:.625rem;flex-wrap:wrap">
            <div class="p-badge badge-level">⚡ ${li.name}</div>
            <div class="p-badge" style="background:rgba(0,229,255,.08);border:1px solid var(--border-glow);color:var(--text-secondary)">📅 ${joinDate.toUpperCase()}</div>
            ${rewards.length?`<div class="p-badge badge-prize">🏆 PRIZE WINNER</div>`:''}
            ${u.isVerified?`<div class="p-badge" style="background:rgba(0,230,118,.1);border:1px solid var(--accent-green);color:var(--accent-green)">✓ VERIFIED</div>`:''}
          </div>
        </div>
      </div>
      <div class="xp-section">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.2rem">
          <span style="font-family:var(--font-ui);font-size:.78rem;color:var(--text-secondary)">${li.name.toUpperCase()} — LEVEL ${li.level}</span>
          <span style="font-family:var(--font-display);font-size:.82rem;color:var(--accent-cyan)">${u.xp||0} XP</span>
        </div>
        <div class="xp-bar-wrap"><div class="xp-bar-fill" id="xpFill" style="width:0%"></div></div>
        <div style="display:flex;justify-content:space-between;font-family:var(--font-ui);font-size:.72rem;color:var(--text-dim);margin-top:.2rem"><span>${li.minXP} XP</span><span>${li.maxXP===Infinity?'MAX':li.maxXP+' XP'}</span></div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card"><div class="stat-card-val">${(u.watched||[]).length}</div><div class="stat-card-lbl">WATCHED</div></div>
      <div class="stat-card"><div class="stat-card-val">${(u.favorites||[]).length}</div><div class="stat-card-lbl">FAVOURITES</div></div>
      <div class="stat-card"><div class="stat-card-val">${(u.watchlist||[]).length}</div><div class="stat-card-lbl">WATCHLIST</div></div>
      <div class="stat-card"><div class="stat-card-val">${u.xp||0}</div><div class="stat-card-lbl">TOTAL XP</div></div>
      <div class="stat-card"><div class="stat-card-val">${rewards.length}</div><div class="stat-card-lbl">PRIZES WON</div></div>
    </div>

    <div class="profile-content">
      <!-- UPI -->
      <div class="upi-section">
        <h3 style="font-family:var(--font-display);font-size:.82rem;letter-spacing:2px;color:var(--accent-gold);margin-bottom:.875rem">💰 UPI ID FOR PRIZE PAYOUT</h3>
        <p style="font-family:var(--font-ui);font-size:.82rem;color:var(--text-secondary);margin-bottom:.875rem">Top 3 monthly users win ₹500/₹300/₹100 via UPI. Add your UPI ID to receive prizes.</p>
        <div style="display:flex;gap:.875rem;flex-wrap:wrap">
          <input type="text" id="upiInput" class="form-input" style="max-width:300px" placeholder="yourname@upi or 9876543210@paytm" value="${u.upiId||''}"/>
          <button class="btn btn-gold btn-sm" onclick="saveUPI()">SAVE UPI</button>
        </div>
        ${rewards.length?`<div style="margin-top:1rem"><p style="font-family:var(--font-ui);font-size:.75rem;color:var(--text-dim);letter-spacing:1px;margin-bottom:.5rem">YOUR PRIZES</p><div style="display:flex;gap:.75rem;flex-wrap:wrap">${rewards.map(r=>`<div style="padding:6px 14px;border-radius:20px;background:rgba(255,215,0,.1);border:1px solid var(--accent-gold);font-family:var(--font-ui);font-size:.78rem;color:var(--accent-gold)">🏆 ${r.month} · Rank #${r.rank} · ₹${r.prize} · ${r.paid?'✅ Paid':'⏳ Pending'}</div>`).join('')}</div></div>`:''}
      </div>

      <div class="tabs">
        <button class="tab-btn active" onclick="showPTab('watchlist')">WATCHLIST (${(u.watchlist||[]).length})</button>
        <button class="tab-btn" onclick="showPTab('watched')">WATCHED (${(u.watched||[]).length})</button>
        <button class="tab-btn" onclick="showPTab('favorites')">FAVOURITES (${(u.favorites||[]).length})</button>
        <button class="tab-btn" onclick="showPTab('achievements')">ACHIEVEMENTS</button>
      </div>

      <div id="ptab-watchlist" class="tab-content active">${renderMovieGrid(u.watchlist||[], false)}</div>
      <div id="ptab-watched"   class="tab-content">${renderMovieGrid(u.watched||[], true)}</div>
      <div id="ptab-favorites" class="tab-content">${renderMovieGrid(u.favorites||[], false, true)}</div>
      <div id="ptab-achievements" class="tab-content">${renderAchievements(u)}</div>
    </div>`;

  setTimeout(()=>{ const f=document.getElementById('xpFill'); if(f)f.style.width=xpPct+'%'; },300);
}

function renderMovieGrid(items, showWatchedBadge=false, isFav=false){
  if(!items.length)return`<div style="text-align:center;padding:3rem;font-family:var(--font-ui)"><div style="font-size:2.5rem;margin-bottom:.75rem">${isFav?'❤️':showWatchedBadge?'✅':'📋'}</div><p style="color:var(--text-dim)">Nothing here yet.</p><a href="index.html" class="btn btn-primary" style="margin-top:1rem;display:inline-flex">BROWSE MOVIES</a></div>`;
  return`<div class="wl-grid">${items.map(m=>`<div class="wl-item" onclick="window.location.href='movie.html?id=${m.movieId}'"><img src="${m.posterPath?'https://image.tmdb.org/t/p/w342'+m.posterPath:CV.PLACEHOLDER}" alt="" onerror="this.src='${CV.PLACEHOLDER}'"/>${showWatchedBadge?'<div class="watched-badge">✓ WATCHED</div>':''}${!showWatchedBadge?`<button class="wl-remove" onclick="event.stopPropagation();removeItem('${isFav?'fav':'wl'}',${m.movieId},'${esc(m.title)}')">✕</button>`:''}</div>`).join('')}</div>`;
}

function renderAchievements(u){
  const watched=(u.watched||[]).length, favs=(u.favorites||[]).length, wl=(u.watchlist||[]).length, xp=u.xp||0, prizes=(u.rewards||[]).filter(r=>r.prize>0).length;
  const achs=[
    {icon:'🌱',name:'First Steps',   desc:'Create your account',       unlocked:true},
    {icon:'✅',name:'First Watch',   desc:'Mark your first movie watched', unlocked:watched>=1},
    {icon:'🎬',name:'Cinephile',     desc:'Watch 5 movies',            unlocked:watched>=5},
    {icon:'🎥',name:'Movie Buff',    desc:'Watch 20 movies',           unlocked:watched>=20},
    {icon:'❤️',name:'Film Lover',    desc:'Add 5 favourites',          unlocked:favs>=5},
    {icon:'💕',name:'Devotee',       desc:'Add 15 favourites',         unlocked:favs>=15},
    {icon:'📋',name:'Curator',       desc:'10 in watchlist',           unlocked:wl>=10},
    {icon:'✍️',name:'First Review',  desc:'Post your first review',    unlocked:xp>=25},
    {icon:'⚡',name:'Power User',    desc:'Reach 500 XP',              unlocked:xp>=500},
    {icon:'🔥',name:'On Fire',       desc:'Reach 1000 XP',             unlocked:xp>=1000},
    {icon:'🌟',name:'Legend',        desc:'Reach 2000 XP',             unlocked:xp>=2000},
    {icon:'💰',name:'Prize Winner',  desc:'Win a monthly prize',       unlocked:prizes>=1},
    {icon:'🏆',name:'Champion',      desc:'Win 3 monthly prizes',      unlocked:prizes>=3},
  ];
  return`<div class="ach-grid">${achs.map(a=>`<div class="ach-card ${a.unlocked?'unlocked':'locked'}"><div class="ach-icon">${a.unlocked?a.icon:'🔒'}</div><div><div style="font-family:var(--font-ui);font-weight:700;font-size:.875rem;color:var(--text-primary)">${a.name}</div><div style="font-size:.72rem;color:var(--text-dim)">${a.desc}</div></div></div>`).join('')}</div>`;
}

function showPTab(name){document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.getElementById('ptab-'+name)?.classList.add('active');document.querySelectorAll('.tab-btn').forEach(b=>{if(b.textContent.toLowerCase().includes(name==='favorites'?'favour':name))b.classList.add('active');});}

async function saveUPI(){const id=document.getElementById('upiInput')?.value.trim();if(!id)return;try{await CV.updateUPI(id);CV.showToast('UPI ID saved! ✓','success');currentUser=await CV.getCurrentUser(true);}catch(e){CV.showToast(e.message,'error');}}

async function removeItem(type,movieId,title){
  try{
    if(type==='fav')await CV.toggleFavorite(movieId,title,'');
    else await CV.toggleWatchlist(movieId,title,'');
    CV.showToast('Removed','info');currentUser=await CV.getCurrentUser(true);renderProfile();CV.updateNavAvatar(currentUser);
  }catch(e){CV.showToast(e.message,'error');}
}

// ── AVATAR MODAL ──
function setupAvatarModal(){
  pendingEmoji=currentUser.avatarEmoji||'🎬'; pendingColor=currentUser.avatarColor||0;
  const grid=document.getElementById('avatarGrid');
  CV.AVATARS.forEach(emoji=>{const d=document.createElement('div');d.className='avatar-option'+(emoji===pendingEmoji?' selected':'');d.textContent=emoji;d.style.background=CV.AVATAR_COLORS[pendingColor];d.onclick=()=>{pendingEmoji=emoji;document.querySelectorAll('.avatar-option').forEach(x=>{x.classList.remove('selected');x.style.background=CV.AVATAR_COLORS[pendingColor];});d.classList.add('selected');};grid.appendChild(d);});
  const cg=document.getElementById('colorGrid');
  CV.AVATAR_COLORS.forEach((color,idx)=>{const d=document.createElement('div');d.className='color-option'+(idx===pendingColor?' selected':'');d.style.background=color;d.onclick=()=>{pendingColor=idx;document.querySelectorAll('.color-option').forEach((x,i)=>x.classList.toggle('selected',i===idx));document.querySelectorAll('.avatar-option').forEach(x=>x.style.background=color);};cg.appendChild(d);});
}
function openAvatarModal(){ document.getElementById('avatarModal').classList.add('open'); }
function closeAvatarModal(){ document.getElementById('avatarModal').classList.remove('open'); }
async function saveAvatar(){
  try{const d=await CV.updateAvatar(pendingEmoji,pendingColor);currentUser=d.user;CV.clearUserCache();CV.updateNavAvatar(currentUser);document.getElementById('pAvatarBig').textContent=pendingEmoji;document.getElementById('pAvatarBig').style.background=CV.AVATAR_COLORS[pendingColor];closeAvatarModal();CV.showToast('Avatar updated! 🎭','success');}
  catch(e){CV.showToast(e.message,'error');}
}
document.getElementById('avatarModal').addEventListener('click',e=>{if(e.target.id==='avatarModal')closeAvatarModal();});

function esc(s){return(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');}
</script>
</body>
</html>
