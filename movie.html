<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>CineVerse — Movie</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .movie-backdrop-wrap {
        position: relative;
        height: 65vh;
        min-height: 380px;
        overflow: hidden;
      }
      .movie-backdrop-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
      }
      .movie-backdrop-wrap::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(5, 8, 16, 0.25) 0%,
          rgba(5, 8, 16, 0.55) 55%,
          var(--bg-primary) 100%
        );
      }
      .movie-detail-content {
        padding: 0 2.5rem 5rem;
        margin-top: -110px;
        position: relative;
        z-index: 2;
      }
      .movie-detail-top {
        display: flex;
        gap: 2.5rem;
        align-items: flex-end;
        margin-bottom: 2rem;
      }
      .movie-poster-big {
        width: 190px;
        min-width: 190px;
        border-radius: var(--radius-md);
        border: 2px solid var(--border-glow);
        box-shadow:
          var(--shadow-cyan),
          0 20px 60px rgba(0, 0, 0, 0.5);
        aspect-ratio: 2/3;
        object-fit: cover;
      }
      .movie-info h1 {
        font-family: var(--font-display);
        font-size: clamp(1.5rem, 3.5vw, 2.6rem);
        font-weight: 900;
        margin-bottom: 0.625rem;
        line-height: 1.1;
      }
      .meta-chip {
        padding: 3px 11px;
        border-radius: 20px;
        font-family: var(--font-ui);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 1px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text-secondary);
      }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .stat-box {
        text-align: center;
        padding: 1.125rem;
        background: var(--bg-card);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: var(--radius-md);
      }
      .stat-value {
        font-family: var(--font-display);
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--accent-cyan);
        margin-bottom: 0.2rem;
      }
      .stat-label {
        font-family: var(--font-ui);
        font-size: 0.68rem;
        color: var(--text-dim);
        letter-spacing: 1px;
      }
      .cast-grid {
        display: flex;
        gap: 0.875rem;
        overflow-x: auto;
        padding-bottom: 1rem;
      }
      .cast-card {
        text-align: center;
        flex-shrink: 0;
        width: 90px;
        cursor: pointer;
      }
      .cast-card:hover .cast-name {
        color: var(--accent-cyan);
      }
      .cast-avatar {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid rgba(0, 229, 255, 0.2);
        margin: 0 auto 0.4rem;
        background: var(--bg-card);
        display: block;
        transition: var(--transition);
      }
      .cast-card:hover .cast-avatar {
        border-color: var(--accent-cyan);
      }
      .cast-name {
        font-family: var(--font-ui);
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: var(--transition);
      }
      .cast-char {
        font-size: 0.65rem;
        color: var(--text-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* WHERE TO WATCH */
      .wtw-section {
        background: var(--bg-card);
        border: 1px solid var(--border-glow);
        border-radius: var(--radius-lg);
        padding: 1.75rem;
        margin-bottom: 2rem;
      }
      .wtw-title {
        font-family: var(--font-display);
        font-size: 0.9rem;
        letter-spacing: 2px;
        color: var(--accent-cyan);
        margin-bottom: 1.25rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .wtw-category {
        margin-bottom: 1.25rem;
      }
      .wtw-category-label {
        font-family: var(--font-ui);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--text-dim);
        margin-bottom: 0.75rem;
      }
      .wtw-providers {
        display: flex;
        flex-wrap: wrap;
        gap: 0.875rem;
      }
      .wtw-provider {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4rem;
        padding: 0.75rem 1rem;
        border-radius: var(--radius-md);
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.03);
        transition: var(--transition);
        min-width: 90px;
        text-decoration: none;
      }
      .wtw-provider:hover {
        border-color: var(--accent-cyan);
        background: rgba(0, 229, 255, 0.06);
        transform: translateY(-3px);
      }
      .wtw-provider img {
        width: 48px;
        height: 48px;
        border-radius: 10px;
        object-fit: contain;
        background: #fff;
        padding: 4px;
      }
      .wtw-provider-name {
        font-family: var(--font-ui);
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--text-primary);
        text-align: center;
      }
      .wtw-provider-type {
        font-size: 0.62rem;
        color: var(--text-dim);
        letter-spacing: 1px;
      }
      .wtw-price {
        font-size: 0.7rem;
        color: var(--accent-gold);
        font-family: var(--font-ui);
        font-weight: 700;
      }
      .wtw-not-available {
        font-family: var(--font-ui);
        color: var(--text-dim);
        font-size: 0.875rem;
        padding: 1rem 0;
      }
      .wtw-region-note {
        font-size: 0.72rem;
        color: var(--text-dim);
        font-family: var(--font-ui);
        margin-top: 0.75rem;
        padding-top: 0.75rem;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      /* REVIEWS */
      .review-form {
        background: var(--bg-card);
        border: 1px solid var(--border-glow);
        border-radius: var(--radius-lg);
        padding: 1.625rem;
        margin-bottom: 1.75rem;
      }
      .review-form h3 {
        font-family: var(--font-display);
        font-size: 0.85rem;
        letter-spacing: 2px;
        margin-bottom: 1.125rem;
        color: var(--accent-cyan);
      }
      .review-textarea {
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(0, 229, 255, 0.2);
        border-radius: var(--radius-md);
        padding: 0.875rem;
        color: var(--text-primary);
        font-family: var(--font-body);
        font-size: 0.875rem;
        resize: vertical;
        min-height: 90px;
        outline: none;
        margin-top: 0.875rem;
        transition: var(--transition);
      }
      .review-textarea:focus {
        border-color: var(--accent-cyan);
        background: rgba(0, 229, 255, 0.03);
      }
      .trailer-wrap {
        position: relative;
        padding-bottom: 56.25%;
        height: 0;
        overflow: hidden;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-glow);
      }
      .trailer-wrap iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      /* FORUM */
      .forum-create-form {
        background: var(--bg-card);
        border: 1px solid var(--border-glow);
        border-radius: var(--radius-lg);
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .tag-selector {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin: 0.75rem 0;
      }
      .tag-toggle {
        padding: 3px 12px;
        border-radius: 20px;
        font-family: var(--font-ui);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-dim);
        transition: var(--transition);
      }
      .tag-toggle.selected {
        border-color: var(--accent-cyan);
        color: var(--accent-cyan);
        background: rgba(0, 229, 255, 0.1);
      }

      /* EXTERNAL IDS */
      .ext-links {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }
      .ext-link {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 5px 14px;
        border-radius: 20px;
        font-family: var(--font-ui);
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 1px;
        text-decoration: none;
        transition: var(--transition);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text-secondary);
      }
      .ext-link:hover {
        border-color: var(--accent-cyan);
        color: var(--accent-cyan);
      }

      @keyframes playerSpin { to { transform: rotate(360deg); } }
      @keyframes toastIn {
        from { opacity: 0; transform: translateY(20px) scale(0.95); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* ── EMBEDDED PLAYER ── */
      .player-section {
        margin-bottom: 2rem;
        border-radius: var(--radius-lg);
        overflow: hidden;
        border: 1px solid var(--border-glow);
        box-shadow: var(--shadow-cyan);
        background: #000;
      }
      .player-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: 0.875rem 1.25rem;
        background: var(--bg-card);
        border-bottom: 1px solid var(--border-glow);
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .player-title {
        font-family: var(--font-display);
        font-size: 0.78rem;
        letter-spacing: 2px;
        color: var(--accent-cyan);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .server-tabs {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .server-btn {
        padding: 4px 14px;
        border-radius: 20px;
        font-family: var(--font-ui);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-dim);
        transition: var(--transition);
      }
      .server-btn:hover, .server-btn.active {
        border-color: var(--accent-cyan);
        color: var(--accent-cyan);
        background: rgba(0, 229, 255, 0.1);
      }
      .player-embed-wrap {
        position: relative;
        padding-bottom: 56.25%;
        height: 0;
        background: #000;
      }
      .player-embed-wrap iframe {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        border: none;
      }
      .player-footer {
        padding: 0.625rem 1.25rem;
        background: var(--bg-card);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .player-notice {
        font-family: var(--font-ui);
        font-size: 0.68rem;
        color: var(--text-dim);
        letter-spacing: 1px;
        flex: 1;
      }
      /* TV episode picker */
      .episode-picker {
        padding: 0.875rem 1.25rem;
        background: var(--bg-card);
        border-top: 1px solid var(--border-glow);
        display: flex;
        gap: 1rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .ep-label {
        font-family: var(--font-ui);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--text-dim);
        white-space: nowrap;
      }
      .ep-select {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(0,229,255,0.25);
        border-radius: var(--radius-sm);
        color: var(--text-primary);
        font-family: var(--font-ui);
        font-size: 0.82rem;
        padding: 5px 10px;
        cursor: pointer;
        outline: none;
        transition: var(--transition);
      }
      .ep-select:focus {
        border-color: var(--accent-cyan);
      }
      .ep-select option {
        background: var(--bg-card);
      }

      @media (max-width: 768px) {
        .movie-detail-top {
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
        .movie-poster-big {
          width: 150px;
          min-width: 150px;
        }
        .movie-detail-content {
          padding: 0 1rem 4rem;
        }
        .stat-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <a href="index.html" class="nav-logo">CINEVERSE</a>
      <ul class="nav-links">
        <li><a href="index.html">HOME</a></li>
        <li><a href="leaderboard.html">LEADERBOARD</a></li>
        <li><a href="forum.html">FORUM</a></li>
        <li><a href="watch-together.html">WATCH TOGETHER</a></li>
        <li id="navProfileLink" style="display: none">
          <a href="profile.html">PROFILE</a>
        </li>
      </ul>
      <div class="nav-right">
        <div id="navAuthArea">
          <button
            class="btn-login-nav"
            onclick="window.location.href = 'index.html'"
          >
            LOGIN / JOIN
          </button>
        </div>
      </div>
    </nav>

    <div class="main-content" id="mainContent">
      <div class="loading-container" style="padding-top: 38vh">
        <div class="spinner"></div>
        <span
          style="
            font-family: var(--font-ui);
            letter-spacing: 3px;
            font-size: 0.8rem;
          "
          >LOADING...</span
        >
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script>
      let currentUser = null,
        currentMovie = null,
        mediaType = "movie",
        selectedRating = 0,
        selectedTags = [];
      const params = new URLSearchParams(location.search);
      const mediaId = parseInt(params.get("id"));
      mediaType = params.get("type") || "movie";
      if (!mediaId) window.location.href = "index.html";

      document.addEventListener("DOMContentLoaded", async () => {
        currentUser = await initNav();
        const d =
          mediaType === "tv"
            ? await CV.tmdbTV(mediaId)
            : await CV.tmdbMovie(mediaId);
        if (!d?.movie) {
          document.getElementById("mainContent").innerHTML =
            '<div class="loading-container" style="padding-top:30vh"><p style="color:var(--text-dim)">Movie not found.</p><a href="index.html" class="btn btn-primary" style="margin-top:1rem">GO HOME</a></div>';
          return;
        }
        currentMovie = d.movie;
        document.title = `CineVerse — ${currentMovie.title || currentMovie.name}`;
        renderPage();
      });

      function renderPage() {
        const m = currentMovie;
        const title = m.title || m.name || "";
        const trailer = (m.videos?.results || []).find(
          (v) => v.type === "Trailer" && v.site === "YouTube",
        );
        const inWL = (currentUser?.watchlist || []).some(
          (x) => x.movieId === m.id,
        );
        const watched = (currentUser?.watched || []).some(
          (x) => x.movieId === m.id,
        );
        const isFav = (currentUser?.favorites || []).some(
          (x) => x.movieId === m.id,
        );
        const loggedIn = CV.isLoggedIn();
        const releaseDate = m.release_date || m.first_air_date || "";
        const runtime = m.runtime || m.episode_run_time?.[0];
        const ext = m.external_ids || {};

        document.getElementById("mainContent").innerHTML = `
    <div class="movie-backdrop-wrap">
      ${m.backdrop_path ? `<img class="movie-backdrop-img" src="${CV.backdropUrl(m.backdrop_path)}" alt="${esc(title)}"/>` : `<div style="width:100%;height:100%;background:var(--bg-secondary)"></div>`}
    </div>
    <div class="movie-detail-content container">
      <div class="movie-detail-top">
        <img class="movie-poster-big" src="${CV.posterUrl(m.poster_path, "w500")}" alt="${esc(title)}" onerror="this.src='${CV.PLACEHOLDER}'"/>
        <div class="movie-info" style="flex:1">
          <h1>${title}</h1>
          ${m.tagline ? `<p style="color:var(--accent-cyan);font-family:var(--font-ui);font-style:italic;margin-bottom:.75rem;font-size:.9rem">"${m.tagline}"</p>` : ""}
          <div style="display:flex;flex-wrap:wrap;gap:.625rem;align-items:center;margin-bottom:.875rem">
            <div class="rating-badge" style="font-size:.85rem">⭐ ${m.vote_average?.toFixed(1)}/10</div>
            ${releaseDate ? `<div class="meta-chip">📅 ${CV.getYear(releaseDate)}</div>` : ""}
            ${runtime ? `<div class="meta-chip">⏱ ${CV.formatRuntime(runtime)}</div>` : ""}
            <div class="meta-chip">🌐 ${m.original_language?.toUpperCase()}</div>
            ${(m.genres || []).map((g) => `<div class="meta-chip">${g.name}</div>`).join("")}
            ${mediaType === "tv" && m.number_of_seasons ? `<div class="meta-chip">📺 ${m.number_of_seasons} Season${m.number_of_seasons > 1 ? "s" : ""}</div>` : ""}
          </div>
          <p style="font-size:.9rem;line-height:1.7;color:var(--text-secondary);max-width:700px;margin-bottom:1.375rem">${m.overview || ""}</p>

          <!-- Action buttons -->
          <div style="display:flex;gap:.875rem;flex-wrap:wrap;margin-bottom:1rem">
            <button class="btn btn-primary" onclick="showEmbedPlayer('${esc(title)}')" id="watchNowBtn" style="background:linear-gradient(90deg,#00e5ff,#7b2fff);border:none;font-weight:800;letter-spacing:2px">▶ WATCH NOW</button>
            ${
              loggedIn
                ? `<button class="btn ${watched ? "btn-ghost" : "btn-outline"}" id="watchedBtn" onclick="doWatch()">${watched ? "✓ WATCHED" : "▶ MARK WATCHED"}</button>
                 <button class="btn btn-outline" id="wlBtn" onclick="doWL()">${inWL ? "✓ IN WATCHLIST" : "+ WATCHLIST"}</button>
                 <button class="btn ${isFav ? "btn-danger" : "btn-ghost"}" id="favBtn" onclick="doFav()">${isFav ? "❤️ FAVOURITED" : "🤍 FAVOURITE"}</button>`
                : `<button class="btn btn-outline" onclick="window.location.href='index.html'">LOGIN TO SAVE</button>`
            }
            ${trailer ? `<button class="btn btn-ghost" onclick="showTab('trailer')">🎬 TRAILER</button>` : ""}
          </div>

          <!-- External links -->
          <div class="ext-links">
            ${ext.imdb_id ? `<a class="ext-link" href="https://www.imdb.com/title/${ext.imdb_id}" target="_blank" rel="noopener">🎬 IMDb</a>` : ""}
            ${m.id ? `<a class="ext-link" href="https://www.themoviedb.org/${mediaType}/${m.id}" target="_blank" rel="noopener">📊 TMDB</a>` : ""}
            ${ext.instagram_id ? `<a class="ext-link" href="https://instagram.com/${ext.instagram_id}" target="_blank" rel="noopener">📸 Instagram</a>` : ""}
            ${ext.twitter_id ? `<a class="ext-link" href="https://twitter.com/${ext.twitter_id}" target="_blank" rel="noopener">🐦 Twitter</a>` : ""}
          </div>
        </div>
      </div>

      <!-- STATS -->
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-value">${m.vote_average?.toFixed(1) || "N/A"}</div><div class="stat-label">RATING</div></div>
        <div class="stat-box"><div class="stat-value">${((m.vote_count || 0) / 1000).toFixed(1)}K</div><div class="stat-label">VOTES</div></div>
        <div class="stat-box"><div class="stat-value">${m.budget ? CV.formatMoney(m.budget) : "N/A"}</div><div class="stat-label">BUDGET</div></div>
        <div class="stat-box"><div class="stat-value">${m.revenue ? CV.formatMoney(m.revenue) : "N/A"}</div><div class="stat-label">REVENUE</div></div>
      </div>

      <!-- EMBEDDED PLAYER -->
      <div class="player-section" id="embedPlayerSection" style="display:none">
        <div class="player-header">
          <div class="player-title">🎬 NOW PLAYING</div>
          <div class="server-tabs" id="serverTabs">
            <button class="server-btn active" onclick="switchServer(0,this)">VidFast</button>
            <button class="server-btn" onclick="switchServer(1,this)">VidSrc.cc</button>
            <button class="server-btn" onclick="switchServer(2,this)">VidSrc.xyz</button>
            <button class="server-btn" onclick="switchServer(3,this)">Vidify</button>
            <button class="server-btn" onclick="switchServer(4,this)">VidPlus</button>
            <button class="server-btn" onclick="switchServer(5,this)">Willow</button>
            <button class="server-btn" onclick="switchServer(6,this)">NunFlix</button>
            <button class="server-btn" onclick="switchServer(7,this)">111Movies</button>
            <button class="server-btn" onclick="switchServer(8,this)">Videasy</button>
            <button class="server-btn" onclick="switchServer(9,this)">VidRock</button>
            <button class="server-btn" onclick="switchServer(10,this)">VidApi</button>
            <button class="server-btn" onclick="switchServer(11,this)">SpencerDevs</button>
            <button class="server-btn" onclick="switchServer(12,this)">Vidzee</button>
            <button class="server-btn" onclick="switchServer(13,this)">TMovie</button>
            <button class="server-btn" onclick="switchServer(14,this)">MultiEmbed</button>
          </div>
        </div>
        ${mediaType === 'tv' ? `
        <div class="episode-picker">
          <span class="ep-label">SEASON</span>
          <select class="ep-select" id="seasonSelect" onchange="onSeasonChange()">
            ${Array.from({length: m.number_of_seasons || 1}, (_,i) => `<option value="${i+1}">Season ${i+1}</option>`).join('')}
          </select>
          <span class="ep-label">EPISODE</span>
          <select class="ep-select" id="episodeSelect" onchange="updateEmbedUrl()">
            ${Array.from({length: (m.seasons?.[0]?.episode_count || 10)}, (_,i) => `<option value="${i+1}">Episode ${i+1}</option>`).join('')}
          </select>
        </div>` : ''}
        <div class="player-embed-wrap">

      function buildDetailItem(label, value) {
        if (!value || value === "N/A" || value === "undefined" || value === "0")

        return `<div style="padding:1rem;background:var(--bg-card);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-md)">

      // ── WHERE TO WATCH ──
      async function loadWhereToWatch() {
        const section = document.getElementById("wtwSection");
        if (!section) return;
        try {
          const d = await CV.whereToWatch(mediaType, mediaId);
          if (
            !d?.available ||
            (!d.providers?.stream?.length &&
              !d.providers?.rent?.length &&
              !d.providers?.buy?.length &&
              !d.providers?.free?.length)
          ) {
            section.innerHTML = `<div class="wtw-title">📍 WHERE TO WATCH</div>
        <div class="wtw-not-available">Not available for streaming in your region right now.<br><span style="font-size:.78rem">Try searching on <a href="https://www.justwatch.com/in/movie/${esc((currentMovie?.title || "").replace(/\s+/g, "-").toLowerCase())}" target="_blank" style="color:var(--accent-cyan)">JustWatch</a> or <a href="https://www.google.com/search?q=watch+${encodeURIComponent(currentMovie?.title || "")}+online" target="_blank" style="color:var(--accent-cyan)">Google</a></span></div>`;
            return;
          }

          let html =
            '<div class="wtw-title">📍 WHERE TO WATCH <span style="font-size:.7rem;color:var(--accent-green);font-family:var(--font-ui);letter-spacing:1px">AVAILABLE NOW</span></div>';

          if (d.providers?.free?.length)
            html += buildWTWCategory("FREE", d.providers.free, "🆓");
          if (d.providers?.stream?.length)
            html += buildWTWCategory(
              "STREAMING (SUBSCRIPTION)",
              d.providers.stream,
              "▶",
            );
          if (d.providers?.rent?.length)
            html += buildWTWCategory("RENT", d.providers.rent, "💵");
          if (d.providers?.buy?.length)
            html += buildWTWCategory("BUY", d.providers.buy, "🛒");

          if (d.link)
            html += `<div class="wtw-region-note">Availability may vary by region. <a href="${d.link}" target="_blank" rel="noopener" style="color:var(--accent-cyan)">See full availability →</a></div>`;
          else
            html += `<div class="wtw-region-note">Showing availability for India/US. <a href="https://www.justwatch.com" target="_blank" style="color:var(--accent-cyan)">Check JustWatch for your region →</a></div>`;

          section.innerHTML = html;
        } catch (e) {
          section.innerHTML = `<div class="wtw-title">📍 WHERE TO WATCH</div><div class="wtw-not-available">Could not load availability. <a href="https://www.justwatch.com" target="_blank" style="color:var(--accent-cyan)">Check JustWatch →</a></div>`;
        }
      }

      function buildWTWCategory(label, providers, icon) {
        return `<div class="wtw-category">
    <div class="wtw-category-label">${icon} ${label}</div>
    <div class="wtw-providers">
      ${providers
        .slice(0, 8)
        .map((p) => {
          const url =
            p.url ||
            (p.name
              ? `https://www.justwatch.com/in/search?q=${encodeURIComponent(p.name)}`
              : "#");
          return `<a class="wtw-provider" href="${url}" target="_blank" rel="noopener">
          ${p.logo ? `<img src="${p.logo}" alt="${p.name}" onerror="this.style.display='none'"/>` : `<div style="width:48px;height:48px;border-radius:10px;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;font-size:1.5rem">${p.logo || "▶"}</div>`}
          <div class="wtw-provider-name">${p.name || "Watch"}</div>
          ${p.price ? `<div class="wtw-price">${p.price}</div>` : `<div class="wtw-provider-type">${label.toLowerCase().includes("free") ? "FREE" : label.toLowerCase().includes("sub") ? "INCLUDED" : label.includes("RENT") ? "RENT" : "BUY"}</div>`}
        </a>`;
        })
        .join("")}
    </div>
  </div>`;
      }

      // ── TABS ──
      function showTab(name) {
        document
          .querySelectorAll(".tab-content")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelectorAll(".tab-btn")
          .forEach((b) => b.classList.remove("active"));
        document.getElementById("tab-" + name)?.classList.add("active");
        document.querySelectorAll(".tab-btn").forEach((b) => {
          if (b.textContent.toLowerCase().includes(name.slice(0, 5)))
            b.classList.add("active");
        });
      }

      // ── REVIEWS ──
      async function loadReviews() {
        const c = document.getElementById("reviewsList");
        if (!c) return;
        try {
          const d = await CV.getMovieReviews(mediaId);
          const reviews = d?.reviews || [];
          const myR = reviews.find((r) => r.username === currentUser?.username);
          if (myR) {
            selectedRating = myR.rating;
            const ft = document.getElementById("reviewFormTitle");
            if (ft) ft.textContent = "✏️ EDIT YOUR REVIEW";
            const rt = document.getElementById("reviewText");
            if (rt) {
              rt.value = myR.text || "";
              const cc = document.getElementById("charCount");
              if (cc) cc.textContent = `${(myR.text || "").length}/1000`;
            }
            const rl = document.getElementById("ratingLabel");
            if (rl) rl.textContent = ratingLabel(myR.rating);
            resetStars();
          }
          if (!reviews.length) {
            c.innerHTML =
              '<p style="color:var(--text-dim);font-family:var(--font-ui);text-align:center;padding:2rem;font-size:.875rem">Be the first to review!</p>';
            return;
          }
          c.innerHTML = reviews
            .map((r) => {
              const isLiked = (r.likes || []).includes(currentUser?._id),
                isOwn = r.username === currentUser?.username;
              return `<div class="review-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem">
          <div class="reviewer-info">
            <div class="reviewer-avatar" style="background:${CV.AVATAR_COLORS[r.avatarColor || 0]}">${r.avatarEmoji || "🎬"}</div>
            <div><div class="reviewer-name">${r.userName}${isOwn ? ' <span style="color:var(--accent-cyan);font-size:.7rem">(YOU)</span>' : ""}</div><div class="review-date">${CV.formatDate(r.createdAt)}</div></div>
          </div>
          <div class="rating-badge">⭐ ${r.rating}/5</div>
        </div>
        ${r.text ? `<p class="review-body">${r.text}</p>` : ""}
        <div style="display:flex;gap:.75rem;align-items:center;margin-top:.625rem">
          <button class="like-btn ${isLiked ? "liked" : ""}" onclick="doLikeReview('${r._id}',this)">${isLiked ? "❤️" : "🤍"} <span>${r.likeCount || 0}</span></button>
          ${isOwn ? `<button class="btn btn-danger btn-sm" onclick="doDelReview('${r._id}')">Delete</button>` : ""}
        </div>
      </div>`;
            })
            .join("");
        } catch {
          c.innerHTML =
            '<p style="color:var(--text-dim);padding:1rem;font-family:var(--font-ui);font-size:.875rem">Could not load reviews.</p>';
        }
      }

      function hoverStars(n) {
        document
          .querySelectorAll(".star")
          .forEach((s, i) => s.classList.toggle("active", i < n));
      }
      function resetStars() {
        document
          .querySelectorAll(".star")
          .forEach((s, i) => s.classList.toggle("active", i < selectedRating));
      }
      function setRating(n) {
        selectedRating = n;
        document.getElementById("ratingLabel").textContent = ratingLabel(n);
        resetStars();
      }
      function ratingLabel(n) {
        return (
          ["", "Terrible 💀", "Bad 😞", "OK 😐", "Good 😊", "Amazing! 🔥"][n] ||
          ""
        );
      }

      async function submitReview() {
        if (!selectedRating) {
          CV.showToast("Select a star rating first ⭐", "error");
          return;
        }
        const text = document.getElementById("reviewText")?.value.trim() || "";
        try {
          await CV.postReview(
            mediaId,
            selectedRating,
            text,
            currentMovie.title || currentMovie.name,
            currentMovie.poster_path,
          );
          CV.showToast("Review posted! +25 XP ⚡", "xp");
          currentUser = await CV.getCurrentUser(true);
          loadReviews();
        } catch (e) {
          CV.showToast(e.message, "error");
        }
      }
      async function doLikeReview(id, btn) {
        try {
          const d = await CV.likeReview(id);
          btn.classList.toggle("liked", d.liked);
          btn.innerHTML = `${d.liked ? "❤️" : "🤍"} <span>${d.likeCount}</span>`;
        } catch (e) {
          CV.showToast(e.message, "error");
        }
      }
      async function doDelReview(id) {
        if (!confirm("Delete review?")) return;
        try {
          await CV.deleteReview(id);
          CV.showToast("Deleted", "info");
          selectedRating = 0;
          resetStars();
          const rt = document.getElementById("reviewText");
          if (rt) rt.value = "";
          const ft = document.getElementById("reviewFormTitle");
          if (ft) ft.textContent = "✍️ WRITE A REVIEW";
          loadReviews();
        } catch (e) {
          CV.showToast(e.message, "error");
        }
      }

      // ── FORUM ──
      async function loadForumPosts() {
        const c = document.getElementById("forumPostsList");
        if (!c) return;
        try {
          const d = await CV.getForumPosts(mediaId);
          const posts = d?.posts || [];
          if (!posts.length) {
            c.innerHTML =
              '<p style="color:var(--text-dim);font-family:var(--font-ui);text-align:center;padding:2rem">No discussions yet. Start one!</p>';
            return;
          }
          c.innerHTML = posts
            .map(
              (p) => `
      <div class="forum-card" onclick="window.location.href='forum.html?post=${p._id}'">
        <div style="display:flex;gap:.875rem">
          <div style="width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;background:${CV.AVATAR_COLORS[p.avatarColor || 0]}">${p.avatarEmoji || "🎬"}</div>
          <div style="flex:1;overflow:hidden">
            <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem;flex-wrap:wrap">${(p.tags || []).map((t) => `<span class="forum-tag tag-${t}">${t}</span>`).join("")}</div>
            <div style="font-family:var(--font-ui);font-size:.95rem;font-weight:700;color:var(--text-primary);margin-bottom:.3rem">${p.title}</div>
            <div style="font-size:.82rem;color:var(--text-secondary);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${p.body}</div>
            <div style="display:flex;gap:1rem;margin-top:.5rem;font-family:var(--font-ui);font-size:.72rem;color:var(--text-dim)">
              <span>@${p.username}</span><span>💬 ${p.replyCount || 0}</span><span>❤️ ${p.likeCount || 0}</span><span>👁 ${p.views || 0}</span><span>${CV.formatDate(p.createdAt)}</span>
            </div>
          </div>
        </div>
      </div>`,
            )
            .join("");
        } catch {
          c.innerHTML =
            '<p style="color:var(--text-dim);padding:1rem">Could not load discussions.</p>';
        }
      }

      function togglePostTag(el) {
        el.classList.toggle("selected");
        const v = el.dataset.tag;
        if (el.classList.contains("selected")) selectedTags.push(v);
        else selectedTags = selectedTags.filter((t) => t !== v);
      }

      async function submitPost() {
        const title = document.getElementById("postTitle")?.value.trim(),
          body = document.getElementById("postBody")?.value.trim();
        if (!title) {
          CV.showToast("Post title required", "error");
          return;
        }
        if (!body) {
          CV.showToast("Post body required", "error");
          return;
        }
        try {
          await CV.createPost(mediaId, {
            title,
            body,
            tags: selectedTags,
            movieTitle: currentMovie.title || currentMovie.name,
            posterPath: currentMovie.poster_path || "",
          });
          CV.showToast("Discussion posted! +10 XP ⚡", "xp");
          document.getElementById("postTitle").value = "";
          document.getElementById("postBody").value = "";
          selectedTags = [];
          document
            .querySelectorAll(".tag-toggle")
            .forEach((t) => t.classList.remove("selected"));
          loadForumPosts();
        } catch (e) {
          CV.showToast(e.message, "error");
        }
      }

      // ── ACTIVITY ──
      async function doWatch() {
        try {
          await CV.markWatched(
            mediaId,
            currentMovie.title || currentMovie.name,
            currentMovie.poster_path,
          );
          CV.showToast("Marked as Watched! +15 XP ⚡", "xp");
          currentUser = await CV.getCurrentUser(true);
          const b = document.getElementById("watchedBtn");
          if (b) {
            b.textContent = "✓ WATCHED";
            b.className = "btn btn-ghost";
          }
        } catch (e) {
          CV.showToast(e.message, "error");
        }
      }
      async function doWL() {
        try {
          const d = await CV.toggleWatchlist(
            mediaId,
            currentMovie.title || currentMovie.name,
            currentMovie.poster_path,
          );
          const a = d.action === "added";
          CV.showToast(
            a ? "Added to Watchlist ✓ +5 XP" : "Removed from Watchlist",
            "success",
          );
          currentUser = await CV.getCurrentUser(true);
          const b = document.getElementById("wlBtn");
          if (b) b.textContent = a ? "✓ IN WATCHLIST" : "+ WATCHLIST";
        } catch (e) {
          CV.showToast(e.message, "error");
        }
      }
      async function doFav() {
        try {
          const d = await CV.toggleFavorite(
            mediaId,
            currentMovie.title || currentMovie.name,
            currentMovie.poster_path,
          );
          const f = d.action === "favorited";
          CV.showToast(
            f ? "❤️ Added to Favourites +10 XP" : "Removed from Favourites",
            f ? "xp" : "info",
          );
          currentUser = await CV.getCurrentUser(true);
          const b = document.getElementById("favBtn");
          if (b) {
            b.textContent = f ? "❤️ FAVOURITED" : "🤍 FAVOURITE";
            b.className = `btn ${f ? "btn-danger" : "btn-ghost"}`;
          }
        } catch (e) {
          CV.showToast(e.message, "error");
        }
      }

      // ── EMBEDDED PLAYER ──
      let activeServer = 0;

      const EMBED_SERVERS = [
        { name: 'vidfast.pro',        movie: id => `https://vidfast.pro/movie/${id}?autoPlay=true`,                          tv: (id,s,e) => `https://vidfast.pro/tv/${id}/${s}/${e}?autoPlay=true` },
        { name: 'vidsrc.cc',          movie: id => `https://vidsrc.cc/v3/embed/movie/${id}`,                                 tv: (id,s,e) => `https://vidsrc.cc/v3/embed/tv/${id}/${s}/${e}` },
        { name: 'vidsrc.xyz',         movie: id => `https://vidsrc.xyz/embed/movie/${id}?autoplay=1`,                        tv: (id,s,e) => `https://vidsrc.xyz/embed/tv/${id}/${s}/${e}?autoplay=1` },
        { name: 'player.vidify.top',  movie: id => `https://player.vidify.top/embed/movie/${id}?autoplay=true`,              tv: (id,s,e) => `https://player.vidify.top/embed/tv/${id}/${s}/${e}?autoplay=true` },
        { name: 'player.vidplus.to',  movie: id => `https://player.vidplus.to/embed/movie/${id}?autoplay=true&server=2`,     tv: (id,s,e) => `https://player.vidplus.to/embed/tv/${id}/${s}/${e}?autoplay=true&server=2` },
        { name: 'willow.arlen.icu',   movie: id => `https://willow.arlen.icu/movies/${id}`,                                  tv: (id,s,e) => `https://willow.arlen.icu/series/${id}/${s}/${e}` },
        { name: 'nunflix.org',        movie: id => `https://nunflix.org/watch/movie/${id}`,                                  tv: (id,s,e) => `https://nunflix.org/watch/tv/${id}/${s}/${e}` },
        { name: '111movies.com',      movie: id => `https://111movies.com/movie/${id}`,                                      tv: (id,s,e) => `https://111movies.com/tv/${id}/${s}/${e}` },
        { name: 'player.videasy.net', movie: id => `https://player.videasy.net/movie/${id}`,                                 tv: (id,s,e) => `https://player.videasy.net/${id}/${s}/${e}` },
        { name: 'vidrock.net',        movie: id => `https://vidrock.net/movie/${id}?autoplay=true`,                          tv: (id,s,e) => `https://vidrock.net/tv/${id}/${s}/${e}?autoplay=true` },
        { name: 'vidapi.xyz',         movie: id => `https://vidapi.xyz/embed/movie/${id}`,                                   tv: (id,s,e) => `https://vidapi.xyz/embed/tv/${id}&s=${s}&e=${e}` },
        { name: 'spencerdevs.xyz',    movie: id => `https://spencerdevs.xyz/movie/${id}?autoPlay=true`,                      tv: (id,s,e) => `https://spencerdevs.xyz/tv/${id}/${s}/${e}?autoPlay=true` },
        { name: 'player.vidzee.wtf',  movie: id => `https://player.vidzee.wtf/embed/movie/${id}`,                           tv: (id,s,e) => `https://player.vidzee.wtf/embed/tv/${id}/${s}/${e}` },
        { name: 'tmovie.tv',          movie: (id,t) => `https://tmovie.tv/movie/${slugify(t)}-${id}?watch=1`,                tv: (id,s,e,t) => `https://tmovie.tv/tv/${slugify(t)}-${id}?watch=1&season=${s}&episode=${e}`, needsTitle: true },
        { name: 'multiembed.mov',     movie: id => `https://multiembed.mov/directstream.php?video_id=${id}&tmdb=1`,          tv: (id,s,e) => `https://multiembed.mov/directstream.php?video_id=${id}&tmdb=1&s=${s}&e=${e}` },
      ];

      function slugify(str) {
        return (str||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
      }

      function getEmbedUrl() {
        const s   = document.getElementById('seasonSelect')?.value  || 1;
        const e   = document.getElementById('episodeSelect')?.value || 1;
        const srv = EMBED_SERVERS[activeServer];
        if (!srv) return '';
        if (mediaType === 'tv') return srv.needsTitle ? srv.tv(mediaId,s,e,movieTitle) : srv.tv(mediaId,s,e);
        return srv.needsTitle ? srv.movie(mediaId,movieTitle) : srv.movie(mediaId);
      }

      let movieTitle = '';

      // ── uBlock Toast ──
      const TOAST_KEY = 'cv_ub_dismissed';
      let _toastTimer = null;

      function showUblockToast() {
        if (localStorage.getItem(TOAST_KEY)) return;
        const t = document.getElementById('ublockToast');
        if (!t) return;
        clearTimeout(_toastTimer);
        _toastTimer = setTimeout(() => {
          t.style.display = 'block';
        }, 3500); // show 3.5s after player opens
      }

      function dismissUblockToast(permanent) {
        const t = document.getElementById('ublockToast');
        if (t) {
          t.style.transition = 'opacity 0.25s, transform 0.25s';
          t.style.opacity = '0';
          t.style.transform = 'translateY(16px)';
          setTimeout(() => { t.style.display = 'none'; t.style.opacity=''; t.style.transform=''; }, 260);
        }
        if (permanent) localStorage.setItem(TOAST_KEY, '1');
        clearTimeout(_toastTimer);
      }

      function showEmbedPlayer(title) {
        if (title) movieTitle = title;
        const section = document.getElementById('embedPlayerSection');
        section.style.display = 'block';
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        updateEmbedUrl();
        showUblockToast();
      }

      function updateEmbedUrl() {
        const frame  = document.getElementById('embedFrame');
        const loader = document.getElementById('playerLoader');
        if (!frame) return;
        if (loader) loader.style.display = 'flex';
        frame.style.opacity = '0';
        frame.src = '';
        setTimeout(() => { frame.src = getEmbedUrl(); }, 50);
        frame.onload = () => {
          if (loader) loader.style.display = 'none';
          frame.style.opacity = '1';
          frame.style.transition = 'opacity 0.3s ease';
        };
        setTimeout(() => { if (loader) loader.style.display='none'; frame.style.opacity='1'; }, 12000);
      }

      function switchServer(idx, btn) {
        activeServer = idx;
        document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        updateEmbedUrl();
      }

      async function onSeasonChange() {
        const seasonNum = parseInt(document.getElementById('seasonSelect')?.value || 1);
        const epSelect = document.getElementById('episodeSelect');
        if (!epSelect) return;
        epSelect.innerHTML = '<option>Loading...</option>';
        try {
          const res = await fetch(`${API_BASE}/tmdb/tv/${mediaId}/season/${seasonNum}`, {
            headers: authHeaders()
          });
          if (res.ok) {
            const d = await res.json();
            const count = d?.season?.episodes?.length || d?.episodes?.length || 20;
            epSelect.innerHTML = Array.from({length: count}, (_,i) =>
              `<option value="${i+1}">Episode ${i+1}</option>`
            ).join('');
          } else { throw new Error(); }
        } catch {
          epSelect.innerHTML = Array.from({length: 30}, (_,i) =>
            `<option value="${i+1}">Episode ${i+1}</option>`
          ).join('');
        }
        updateEmbedUrl();
      }

      function esc(s) {
        return (s || "").replace(/'/g, "\\'").replace(/"/g, "&quot;");
      }
    </script>
  </body>
</html>
