<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>CineVerse — Movie Forum</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .forum-hero {
        padding: 6rem 2.5rem 2.5rem;
      }
      .forum-title {
        font-family: var(--font-display);
        font-size: clamp(1.8rem, 4vw, 2.8rem);
        font-weight: 900;
        letter-spacing: 4px;
        background: var(--grad-accent);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.4rem;
      }
      .forum-sub {
        font-family: var(--font-ui);
        color: var(--text-dim);
        letter-spacing: 3px;
        font-size: 0.8rem;
      }

      .forum-layout {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 2rem;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 2.5rem 4rem;
      }
      @media (max-width: 900px) {
        .forum-layout {
          grid-template-columns: 1fr;
          padding: 0 1rem 4rem;
        }
        .forum-sidebar {
          order: -1;
        }
      }

      /* Post detail */
      .post-detail {
        background: var(--bg-card);
        border: 1px solid var(--border-glow);
        border-radius: var(--radius-lg);
        padding: 2rem;
        margin-bottom: 1.5rem;
      }
      .post-detail h1 {
        font-family: var(--font-ui);
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 1rem;
        line-height: 1.4;
      }
      .post-body-text {
        font-size: 0.9rem;
        line-height: 1.75;
        color: var(--text-secondary);
        white-space: pre-wrap;
      }

      .reply-form {
        background: var(--bg-card);
        border: 1px solid var(--border-glow);
        border-radius: var(--radius-lg);
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .reply-card {
        background: var(--bg-secondary);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: var(--radius-md);
        padding: 1.125rem;
        margin-bottom: 0.75rem;
        transition: var(--transition);
      }
      .reply-card:hover {
        border-color: var(--border-glow);
      }

      .hot-post {
        display: flex;
        gap: 0.875rem;
        padding: 0.75rem;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: var(--transition);
      }
      .hot-post:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .hot-poster {
        width: 44px;
        height: 66px;
        border-radius: 6px;
        object-fit: cover;
        flex-shrink: 0;
        background: var(--bg-card);
      }
      .hot-title {
        font-family: var(--font-ui);
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--text-primary);
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .hot-meta {
        font-size: 0.7rem;
        color: var(--text-dim);
        margin-top: 3px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <a href="index.html" class="nav-logo">CINEVERSE</a>
      <ul class="nav-links">
        <li><a href="index.html">HOME</a></li>
        <li><a href="leaderboard.html">LEADERBOARD</a></li>
        <li><a href="forum.html" class="active">FORUM</a></li>
        <li><a href="watch-together.html">WATCH TOGETHER</a></li>
        <li id="navProfileLink" style="display: none">
          <a href="profile.html">PROFILE</a>
        </li>
      </ul>
      <div class="nav-right">
        <div id="navAuthArea">
          <button
            class="btn-login-nav"
            onclick="window.location.href = 'index.html'"
          >
            LOGIN / JOIN
          </button>
        </div>
      </div>
    </nav>

    <div class="main-content" id="mainContent">
      <div class="loading-container" style="padding-top: 38vh">
        <div class="spinner"></div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script>
      let currentUser = null;
      const params = new URLSearchParams(location.search);
      const postId = params.get("post");
      const movieIdParam = params.get("movie");

      document.addEventListener("DOMContentLoaded", async () => {
        currentUser = await initNav();

        if (postId) {
          renderPostDetail();
        } else {
          renderForumFeed();
        }
      });

      // ── FORUM FEED ──
      async function renderForumFeed() {
        document.title = "CineVerse — Movie Forum";
        const [recentData, hotData] = await Promise.all([
          CV.getRecentPosts(),
          CV.getRecentPosts(),
        ]);

        const posts = recentData?.posts || [];
        const hot = [...posts]
          .sort(
            (a, b) =>
              b.likeCount + b.replyCount * 2 - (a.likeCount + a.replyCount * 2),
          )
          .slice(0, 5);

        document.getElementById("mainContent").innerHTML = `
    <div style="padding:5.5rem 2.5rem 1.5rem">
      <div class="forum-title">💬 MOVIE FORUM</div>
      <div class="forum-sub">DISCUSS · THEORISE · DEBATE · CONNECT</div>
    </div>
    <div class="forum-layout">
      <!-- MAIN -->
      <div>
        <div class="section-header">
          <div class="section-title">RECENT DISCUSSIONS</div>
          <span style="font-family:var(--font-ui);font-size:.72rem;color:var(--text-dim)">${posts.length} POSTS</span>
        </div>
        ${
          posts.length === 0
            ? `<div style="text-align:center;padding:4rem;font-family:var(--font-ui)"><div style="font-size:3rem;margin-bottom:1rem">💬</div><p style="color:var(--text-dim)">No discussions yet. Go to a movie page and start one!</p><a href="index.html" class="btn btn-primary" style="margin-top:1rem;display:inline-flex">BROWSE MOVIES</a></div>`
            : posts.map((p) => renderPostCard(p)).join("")
        }
      </div>

      <!-- SIDEBAR -->
      <div class="forum-sidebar">
        <div class="glass-card" style="padding:1.5rem;margin-bottom:1.5rem">
          <div style="font-family:var(--font-display);font-size:.82rem;letter-spacing:2px;color:var(--accent-cyan);margin-bottom:1rem">🔥 TRENDING DISCUSSIONS</div>
          ${hot
            .map(
              (p) => `
            <div class="hot-post" onclick="window.location.href='forum.html?post=${p._id}'">
              <img class="hot-poster" src="${p.posterPath ? "https://image.tmdb.org/t/p/w92" + p.posterPath : CV.PLACEHOLDER}" onerror="this.src='${CV.PLACEHOLDER}'"/>
              <div>
                <div class="hot-title">${p.title}</div>
                <div class="hot-meta">💬 ${p.replyCount || 0} · ❤️ ${p.likeCount || 0} · ${p.movieTitle}</div>
              </div>
            </div>`,
            )
            .join("")}
        </div>

        <div class="glass-card" style="padding:1.5rem">
          <div style="font-family:var(--font-display);font-size:.82rem;letter-spacing:2px;color:var(--accent-cyan);margin-bottom:1rem">📌 FORUM RULES</div>
          ${["Be respectful — no hate speech", "Tag spoilers properly", "Stay on topic for each movie", "No spam or self-promotion", "Have fun discussing movies!"].map((r) => `<div style="font-family:var(--font-ui);font-size:.8rem;color:var(--text-secondary);padding:.4rem 0;border-bottom:1px solid rgba(255,255,255,.05)">• ${r}</div>`).join("")}
        </div>
      </div>
    </div>`;
      }

      function renderPostCard(p) {
        return `<div class="forum-card" onclick="window.location.href='forum.html?post=${p._id}'">
    <div style="display:flex;gap:.875rem">
      <div style="width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;background:${CV.AVATAR_COLORS[p.avatarColor || 0]}">${p.avatarEmoji || "🎬"}</div>
      <div style="flex:1;overflow:hidden">
        <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem;flex-wrap:wrap">
          ${(p.tags || []).map((t) => `<span class="forum-tag tag-${t}">${t}</span>`).join("")}
          <span style="font-family:var(--font-ui);font-size:.72rem;color:var(--accent-cyan)">📽️ ${p.movieTitle}</span>
        </div>
        <div style="font-family:var(--font-ui);font-size:.95rem;font-weight:700;color:var(--text-primary);margin-bottom:.3rem">${p.title}</div>
        <div style="font-size:.82rem;color:var(--text-secondary);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${p.body}</div>
        <div style="display:flex;gap:1rem;margin-top:.5rem;font-family:var(--font-ui);font-size:.72rem;color:var(--text-dim)">
          <span>@${p.username}</span><span>💬 ${p.replyCount || 0}</span><span>❤️ ${p.likeCount || 0}</span><span>👁 ${p.views || 0}</span><span>${CV.formatDate(p.createdAt)}</span>
        </div>
      </div>
    </div>
  </div>`;
      }

      // ── POST DETAIL ──
      async function renderPostDetail() {
        try {
          const d = await CV.getForumPost(postId);
          const p = d?.post;
          if (!p) {
            document.getElementById("mainContent").innerHTML =
              '<div class="loading-container" style="padding-top:30vh"><p style="color:var(--text-dim)">Post not found.</p></div>';
            return;
          }

          document.title = `CineVerse Forum — ${p.title}`;
          const loggedIn = CV.isLoggedIn();
          const isLiked = (p.likes || []).includes(currentUser?._id);
          const isOwn = p.username === currentUser?.username;
          const validReplies = (p.replies || []).filter((r) => !r.isDeleted);

          document.getElementById("mainContent").innerHTML = `
      <div style="max-width:900px;margin:0 auto;padding:5.5rem 2.5rem 4rem">
        <!-- Breadcrumb -->
        <div style="font-family:var(--font-ui);font-size:.78rem;color:var(--text-dim);margin-bottom:1.5rem">
          <a href="index.html" style="color:var(--accent-cyan);text-decoration:none">HOME</a> / 
          <a href="movie.html?id=${p.movieId}" style="color:var(--accent-cyan);text-decoration:none">${p.movieTitle}</a> / 
          <span>FORUM</span>
        </div>

        <!-- Post -->
        <div class="post-detail">
          <div style="display:flex;align-items:center;gap:.875rem;margin-bottom:1.25rem">
            <div style="width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;background:${CV.AVATAR_COLORS[p.avatarColor || 0]}">${p.avatarEmoji || "🎬"}</div>
            <div>
              <div style="font-family:var(--font-ui);font-weight:700;color:var(--text-primary)">${p.userName}</div>
              <div style="font-size:.72rem;color:var(--text-dim)">@${p.username} · ${CV.formatDate(p.createdAt)}</div>
            </div>
            <div style="margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap">
              ${(p.tags || []).map((t) => `<span class="forum-tag tag-${t}">${t}</span>`).join("")}
            </div>
          </div>

          <div style="display:flex;align-items:center;gap:1rem;margin-bottom:.5rem">
            <img src="${p.posterPath ? "https://image.tmdb.org/t/p/w92" + p.posterPath : CV.PLACEHOLDER}" style="width:32px;height:48px;border-radius:4px;object-fit:cover"/>
            <a href="movie.html?id=${p.movieId}" style="font-family:var(--font-ui);font-size:.82rem;color:var(--accent-cyan);text-decoration:none">📽️ ${p.movieTitle}</a>
          </div>

          <h1 class="post-detail" style="font-family:var(--font-ui);font-size:1.3rem;font-weight:700;color:var(--text-primary);margin-bottom:1rem;background:none;border:none;padding:0">${p.title}</h1>
          <p class="post-body-text">${p.body}</p>

          <div style="display:flex;gap:1rem;align-items:center;margin-top:1.25rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.06)">
            <button class="like-btn ${isLiked ? "liked" : ""}" id="postLikeBtn" onclick="doLikePost('${p._id}',this)">
              ${isLiked ? "❤️" : "🤍"} <span id="postLikeCount">${p.likeCount || 0}</span> likes
            </button>
            <span style="font-family:var(--font-ui);font-size:.78rem;color:var(--text-dim)">💬 ${validReplies.length} replies · 👁 ${p.views || 0} views</span>
            ${isOwn ? `<button class="btn btn-danger btn-sm" onclick="doDeletePost('${p._id}')">Delete Post</button>` : ""}
          </div>
        </div>

        <!-- Reply Form -->
        ${
          loggedIn
            ? `
        <div class="reply-form">
          <div style="font-family:var(--font-display);font-size:.82rem;letter-spacing:2px;color:var(--accent-cyan);margin-bottom:1rem">✍️ ADD YOUR REPLY</div>
          <textarea class="review-textarea" id="replyBody" placeholder="Share your thoughts..." maxlength="1000" style="min-height:80px"></textarea>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:.625rem">
            <span id="replyCount" style="font-size:.72rem;color:var(--text-dim);font-family:var(--font-ui)">0/1000</span>
            <button class="btn btn-primary btn-sm" onclick="submitReply('${p._id}')">REPLY +5 XP ⚡</button>
          </div>
        </div>`
            : `<div style="text-align:center;padding:1.5rem;background:var(--bg-card);border-radius:var(--radius-lg);border:1px solid var(--border-glow);margin-bottom:1.5rem">
          <a href="index.html" class="btn btn-primary btn-sm">LOGIN TO REPLY</a>
        </div>`
        }

        <!-- Replies -->
        <div class="section-header" style="margin-top:.5rem">
          <div class="section-title">REPLIES (${validReplies.length})</div>
        </div>
        <div id="repliesList">
          ${
            validReplies.length === 0
              ? `<p style="color:var(--text-dim);font-family:var(--font-ui);text-align:center;padding:2rem">No replies yet. Be the first!</p>`
              : validReplies.map((r) => renderReply(r)).join("")
          }
        </div>
      </div>`;

          const ta = document.getElementById("replyBody"),
            cc = document.getElementById("replyCount");
          ta?.addEventListener(
            "input",
            () => (cc.textContent = `${ta.value.length}/1000`),
          );
        } catch (e) {
          document.getElementById("mainContent").innerHTML =
            '<div class="loading-container" style="padding-top:30vh"><p style="color:var(--text-dim)">Could not load post.</p></div>';
        }
      }

      function renderReply(r) {
        const isOwn = r.username === currentUser?.username;
        const isLiked = (r.likes || []).includes(currentUser?._id);
        return `<div class="reply-card" id="reply-${r._id}">
    <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.625rem">
      <div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;background:${CV.AVATAR_COLORS[r.avatarColor || 0]}">${r.avatarEmoji || "🎬"}</div>
      <div>
        <div style="font-family:var(--font-ui);font-weight:700;font-size:.875rem;color:var(--text-primary)">${r.userName} ${isOwn ? '<span style="color:var(--accent-cyan);font-size:.68rem">(YOU)</span>' : ""}</div>
        <div style="font-size:.7rem;color:var(--text-dim)">${CV.formatDate(r.createdAt)}</div>
      </div>
    </div>
    <p style="font-size:.875rem;color:var(--text-secondary);line-height:1.6;white-space:pre-wrap">${r.body}</p>
    <div style="display:flex;gap:.75rem;margin-top:.625rem">
      <button class="like-btn ${isLiked ? "liked" : ""}" onclick="likeReply(this,'${r._id}')">${isLiked ? "❤️" : "🤍"} <span>${r.likeCount || 0}</span></button>
    </div>
  </div>`;
      }

      async function submitReply(postId) {
        const body = document.getElementById("replyBody")?.value.trim();
        if (!body) {
          CV.showToast("Reply cannot be empty", "error");
          return;
        }
        try {
          const d = await CV.replyToPost(postId, body);
          CV.showToast("Reply posted! +5 XP ⚡", "xp");
          document.getElementById("replyBody").value = "";
          // Re-render replies
          const validReplies = (d.post?.replies || []).filter(
            (r) => !r.isDeleted,
          );
          document.getElementById("repliesList").innerHTML = validReplies
            .map((r) => renderReply(r))
            .join("");
          document
            .querySelector(".section-title")
            ?.closest(".section-header")
            ?.querySelector(".section-title");
        } catch (e) {
          CV.showToast(e.message, "error");
        }
      }

      async function doLikePost(postId, btn) {
        if (!CV.isLoggedIn()) {
          window.location.href = "index.html";
          return;
        }
        try {
          const d = await CV.likePost(postId);
          btn.classList.toggle("liked", d.liked);
          btn.querySelector("span").textContent = d.likeCount;
          btn.innerHTML = `${d.liked ? "❤️" : "🤍"} <span>${d.likeCount}</span> likes`;
          btn.classList.toggle("liked", d.liked);
        } catch (e) {
          CV.showToast(e.message, "error");
        }
      }

      async function likeReply(btn, replyId) {
        CV.showToast("Reply likes coming soon!", "info"); // Can be expanded
      }

      async function doDeletePost(postId) {
        if (!confirm("Delete this post?")) return;
        try {
          await CV.deletePost(postId);
          CV.showToast("Post deleted", "info");
          window.location.href = "forum.html";
        } catch (e) {
          CV.showToast(e.message, "error");
        }
      }
    </script>
  </body>
</html>
